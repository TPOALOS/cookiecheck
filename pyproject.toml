[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cookiecheck"
version = "1.0.0"
description = "Offline lint of Set-Cookie headers: missing Secure/HttpOnly/SameSite, prefix rule violations, broad Domain, risky values. Never touches the network. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["cookies", "set-cookie", "lint", "security", "http"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/cookiecheck"

[project.scripts]
cookiecheck = "cookiecheck:main"

[tool.setuptools]
py-modules = ["cookiecheck"]
